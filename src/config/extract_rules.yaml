# ==================================================================================================
# CẤU HÌNH TRÍCH XUẤT DỮ LIỆU ETL (EXTRACT PIPELINE RULES)
# --------------------------------------------------------------------------------------------------
# THIẾT KẾ 3 CHẾ ĐỘ LẤY CỘT (COLUMN EXTRACTION MODES):
# 1. all:      Lấy tất cả cột của bảng nguồn (Khi muốn lấy toàn bộ dữ liệu).
#              Cú pháp:
#                columns:
#                  mode: all
#
# 2. selected: Chỉ lấy các cột được chỉ định (Khi chỉ cần một số cột).
#              Cú pháp:
#                columns:
#                  mode: selected
#                  list:
#                    - column_name_1
#                    - column_name_2
#
# 3. exclude:  Lấy tất cả trừ những cột không muốn lấy (Khi muốn bỏ một vài cột).
#              Cú pháp:
#                columns:
#                  mode: exclude
#                  list:
#                    - unwanted_column_1
# ==================================================================================================

# --------------------------------------------------------------------------------------------------
# BẢNG 1: CUSTOMERS (Khách hàng)
# --------------------------------------------------------------------------------------------------
customers:
  strategy: full
  target_table: olist_customers_dataset
  candidates:
    - olist_customers_dataset
    - customers
  primary_keys:
    - customer_id
  columns:
    mode: all
  chunksize: 50000

# --------------------------------------------------------------------------------------------------
# BẢNG 2: ORDERS (Đơn hàng)
# --------------------------------------------------------------------------------------------------
orders:
  strategy: full
  target_table: olist_orders_dataset
  candidates:
    - olist_orders_dataset
    - orders
  primary_keys:
    - order_id
  watermark_column: order_purchase_timestamp
  default_start_watermark: "2016-01-01 00:00:00"
  columns:
    mode: all
  chunksize: 25000

# --------------------------------------------------------------------------------------------------
# BẢNG 3: ORDER_REVIEWS (Đánh giá đơn hàng)
# --------------------------------------------------------------------------------------------------
order_reviews:
  strategy: full
  target_table: olist_order_reviews_dataset
  candidates:
    - olist_order_reviews_dataset
    - order_reviews
  primary_keys:
    - review_id
    - order_id
  watermark_column: review_creation_date
  lookback_days: 3
  default_start_watermark: "2016-01-01 00:00:00"
  columns:
    mode: all
  chunksize: 25000

# --------------------------------------------------------------------------------------------------
# BẢNG 4: ORDER_PAYMENTS (Thanh toán đơn hàng)
# --------------------------------------------------------------------------------------------------
order_payments:
  strategy: full
  target_table: olist_order_payments_dataset
  candidates:
    - olist_order_payments_dataset
    - order_payments
  primary_keys:
    - order_id
    - payment_sequential
  columns:
    mode: all
  chunksize: 50000

# --------------------------------------------------------------------------------------------------
# BẢNG 5: ORDER_ITEMS (Chi tiết sản phẩm trong đơn)
# --------------------------------------------------------------------------------------------------
order_items:
  strategy: full
  target_table: olist_order_items_dataset
  candidates:
    - olist_order_items_dataset
    - order_items
  primary_keys:
    - order_id
    - order_item_id
  columns:
    mode: all
  chunksize: 50000

# --------------------------------------------------------------------------------------------------
# BẢNG 6: PRODUCTS (Danh mục sản phẩm)
# --------------------------------------------------------------------------------------------------
products:
  strategy: full
  target_table: olist_products_dataset
  candidates:
    - olist_products_dataset
    - products
  primary_keys:
    - product_id
  columns:
    mode: all
  chunksize: 50000

# --------------------------------------------------------------------------------------------------
# BẢNG 7: SELLERS (Người bán / Đối tác)
# --------------------------------------------------------------------------------------------------
sellers:
  strategy: full
  target_table: olist_sellers_dataset
  candidates:
    - olist_sellers_dataset
    - sellers
  primary_keys:
    - seller_id
  columns:
    mode: all
  chunksize: 50000
