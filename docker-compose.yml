services:
  # 1. Target Data Warehouse: PostgreSQL Database
  postgres_dwh:
    image: postgres:16
    container_name: olist_postgres_dwh
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TGT_DB_NAME:-olist_dwh}
      POSTGRES_USER: ${TGT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TGT_DB_PASSWORD:-123}
    ports:
      - "${TGT_DB_PORT:-5432}:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
    networks:
      - etl_network

  etl_pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist_etl_app
    depends_on:
      - postgres_dwh
    env_file:
      - .env
    environment:
      - SRC_DB_SERVER=host.docker.internal
      - SRC_DB_TRUSTED_CONNECTION=no
      - TGT_DB_HOST=postgres_dwh
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - etl_network

volumes:
  postgres_dwh_data:

networks:
  etl_network:
    driver: bridge
