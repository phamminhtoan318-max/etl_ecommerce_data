services:
  sqlserver_oltp:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: olist_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SRC_DB_PASSWORD:-YourStrongPassword123!}"
      MSSQL_PID: "Express"
    ports:
      - "${SRC_DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - elt_network

  postgres_dwh:
    image: postgres:16
    container_name: olist_dwh
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TGT_DB_NAME:-olist_dwh}
      POSTGRES_USER: ${TGT_DB_USER:-postgres}
      POSTGRES_PASSWORD: "${TGT_DB_PASSWORD:?Thieu TGT_DB_PASSWORD - chay bang ./run.sh docker}"
    ports:
      - "${TGT_DB_PORT:-5432}:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - elt_network

  etl_pipeline:
    build:
      context: ..
      dockerfile: Docker/Dockerfile 
    image: olist_etl_app
    container_name: olist_etl_app
    depends_on:
      postgres_dwh:
        condition: service_healthy
      sqlserver_oltp:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - SRC_DB_SERVER=sqlserver_oltp
      - SRC_DB_TRUSTED_CONNECTION=no
      - TGT_DB_HOST=postgres_dwh
      - TGT_DB_PORT=5432
    volumes:
      - ../logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - elt_network

volumes:
  postgres_dwh_data:
  sqlserver_data:

networks:
  elt_network:
    driver: bridge
