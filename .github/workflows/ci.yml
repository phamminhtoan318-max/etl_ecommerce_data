
name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit-tests:
    name: Python Unit Tests & Schema Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for ODBC
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Unit Tests
        run: |
          python -m unittest discover tests

  dbt-validation:
    name: dbt Syntax, Models & DAG Validation
    runs-on: ubuntu-latest
    env:
      TGT_DB_HOST: localhost
      TGT_DB_PORT: 5432
      TGT_DB_USER: postgres
      TGT_DB_PASSWORD: postgres_ci_password
      TGT_DB_NAME: olist_dwh
      TGT_DB_SCHEMA: bronze
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres

      - name: Validate dbt Models, Macros & Lineage
        run: |
          cd dbt_transform
          dbt deps
          dbt parse

  docker-build:
    name: Docker Container Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/Dockerfile
          push: false

