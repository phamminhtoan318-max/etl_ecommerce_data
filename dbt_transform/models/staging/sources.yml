version: 2

sources:
  - name: bronze
    schema: "{{ env_var('TGT_DB_SCHEMA', 'bronze') }}"
    description: "Tầng dữ liệu thô (Bronze Layer) được Python trích xuất nguyên bản 100% từ SQL Server"
    tables:
      - name: olist_customers_dataset
        description: "Bảng dữ liệu khách hàng thô"
      - name: olist_products_dataset
        description: "Bảng dữ liệu danh mục sản phẩm thô"
      - name: olist_sellers_dataset
        description: "Bảng dữ liệu đối tác người bán thô"
      - name: olist_orders_dataset
        description: "Bảng dữ liệu đơn hàng thô"
      - name: olist_order_items_dataset
        description: "Bảng dữ liệu chi tiết mặt hàng trong đơn thô"
      - name: olist_order_payments_dataset
        description: "Bảng dữ liệu thanh toán đơn hàng thô"
      - name: olist_order_reviews_dataset
        description: "Bảng dữ liệu đánh giá đơn hàng thô"
