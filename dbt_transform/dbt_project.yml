name: 'dbt_transform'
version: '1.0.0'

profile: 'dbt_transform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "../logs/dbt.log"

models:
  dbt_transform:
    staging:
      +materialized: view
      +schema: stg
    marts:
      +materialized: table
      +schema: marts

tests:
  dbt_transform:
    +store_failures: true
    +schema: test_failures
