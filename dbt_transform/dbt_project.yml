name: 'dbt_transform'
version: '1.0.0'

profile: 'dbt_transform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
log-path: "../logs"

clean-targets:
  - "target"
  - "dbt_packages"
  - "../logs/pipeline.log"

models:
  dbt_transform:
    +pre-hook:
      - "SET lock_timeout = '30s'; SET statement_timeout = '300s';"
    staging:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: gold

snapshots:
  dbt_transform:
    +pre-hook:
      - "SET lock_timeout = '30s'; SET statement_timeout = '300s';"

tests:
  dbt_transform:
    +store_failures: true
    +schema: test_failures
